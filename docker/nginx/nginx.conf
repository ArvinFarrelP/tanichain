worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    upstream frontend_upstream {
        server tanichain-frontend:3000;
    }

    upstream backend_upstream {
        server tanichain-backend:4000;
    }

    # Redirect HTTP -> HTTPS
    server {
        listen 80;
        server_name tanichain.arvinlabs.tech;

        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;
        http2 on;

        server_name tanichain.arvinlabs.tech;

        ssl_certificate /etc/letsencrypt/live/tanichain.arvinlabs.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tanichain.arvinlabs.tech/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 10M;

        location /api/ {
            proxy_pass http://backend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://frontend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
