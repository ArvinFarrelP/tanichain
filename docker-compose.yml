services:
  postgres:
    image: postgres:16-alpine
    container_name: tanichain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tanichain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tanichain_password}
      POSTGRES_DB: ${POSTGRES_DB:-tanichain}
    ports:
      - "5432:5432"
    volumes:
      - tanichain_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tanichain} -d ${POSTGRES_DB:-tanichain}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tanichain-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tanichain-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-tanichain}:${POSTGRES_PASSWORD:-tanichain_password}@postgres:5432/${POSTGRES_DB:-tanichain}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change_this_jwt_secret_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      WALLET_ENCRYPTION_KEY: ${WALLET_ENCRYPTION_KEY:-change_this_encryption_key_in_production}
      STELLAR_NETWORK: ${STELLAR_NETWORK:-TESTNET}
      STELLAR_HORIZON_URL: ${STELLAR_HORIZON_URL:-https://horizon-testnet.stellar.org}
      STELLAR_FRIENDBOT_URL: ${STELLAR_FRIENDBOT_URL:-https://friendbot.stellar.org}
      STELLAR_EXPLORER_BASE_URL: ${STELLAR_EXPLORER_BASE_URL:-https://stellar.expert/explorer/testnet}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://tanichain.arvinlabs.tech}
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 300
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - tanichain-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://tanichain.arvinlabs.tech/api}
    container_name: tanichain-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://tanichain.arvinlabs.tech/api}
    ports:
      - "3000:3000"
    networks:
      - tanichain-network

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: tanichain-nginx
    restart: unless-stopped

    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    networks:
      - tanichain-network

volumes:
  tanichain_postgres_data:

networks:
  tanichain-network:
    driver: bridge
